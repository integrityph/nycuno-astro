backend:
  name: github
  repo: integrityph/nycuno-astro
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: pages
    label: Website Pages
    files:
      - name: homepage
        label: Homepage
        file: src/content/pages/homepage.md
        fields:
          - label: Hero Section
            name: hero
            widget: object
            fields:
              - { label: Brand Text, name: brand_text, widget: string }
              - { label: Brand Suffix, name: brand_suffix, widget: string }
              - { label: Heading Prefix, name: heading_prefix, widget: string }
              - { label: Heading Highlight, name: heading_highlight, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Background Image, name: background_image, widget: image }
              - { label: Promotional Image, name: promotional_image, widget: image }
              - { label: Promotional Image Alt, name: promotional_image_alt, widget: string }
          - label: Why Choose NYC Uno
            name: benefits
            widget: object
            fields:
              - { label: Section Heading, name: heading, widget: string }
              - label: Benefit Cards
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Icon, name: icon, widget: image }
                  - { label: Icon Alt Text, name: iconAlt, widget: string, required: false }
          - label: How It Works
            name: how_it_works
            widget: object
            fields:
              - { label: Section Heading, name: heading, widget: string }
              - { label: Background Image, name: background_image, widget: image }
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Image, name: image, widget: image }
                  - { label: Image Alt Text, name: image_alt, widget: string }
          - label: Our Services Section
            name: services
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Service Items
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Icon, name: icon, widget: image }
          - label: Drive With Us Section
            name: drive_with_us
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Button Text, name: button_text, widget: string }
              - { label: Button URL, name: button_url, widget: string }
              - label: Driver Benefits
                name: benefits
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Icon, name: icon, widget: image }
          - label: Ride Options
            name: ride_options
            widget: object
            fields:
              - label: Section Heading
                name: heading
                widget: string

              - label: Ride Options
                name: items
                widget: list
                fields:
                  - label: Title
                    name: title
                    widget: string

                  - label: Description
                    name: description
                    widget: text

                  - label: Icon
                    name: icon
                    widget: image
          - label: Promotional Banners
            name: promotional_banners
            widget: object
            fields:
              - label: Banners
                name: items
                widget: list
                fields:
                  - label: Heading
                    name: heading
                    widget: string

                  - label: Button Text
                    name: button_text
                    widget: string

                  - label: Button URL
                    name: button_url
                    widget: string

                  - label: Theme
                    name: theme
                    widget: select
                    options:
                      - label: Dark
                        value: dark
                      - label: Yellow
                        value: yellow
          - label: Easy Registration
            name: easy_registration
            widget: object
            fields:
              - label: Section Heading
                name: heading
                widget: string

              - label: Section Description
                name: description
                widget: text

              - label: Registration Cards
                name: items
                widget: list
                fields:
                  - label: Card Title
                    name: title
                    widget: string

                  - label: Image
                    name: image
                    widget: image

                  - label: Image Alt Text
                    name: image_alt
                    widget: string

                  - label: Destination URL
                    name: url
                    widget: string
          - label: "Testimonials"
            name: "testimonials"
            widget: "object"
            fields:
              - label: "Section Heading"
                name: "heading"
                widget: "string"
              - label: "Testimonials"
                name: "items"
                widget: "list"
                fields:
                  - label: "Quote"
                    name: "quote"
                    widget: "text"

                  - label: "Name"
                    name: "name"
                    widget: "string"

                  - label: "Location"
                    name: "location"
                    widget: "string"

                  - label: "Rating"
                    name: "rating"
                    widget: "number"
                    value_type: "int"
                    min: 1
                    max: 5
          - label: "Safety & Support"
            name: "safety_support"
            widget: "object"
            fields:
              - label: "Section Heading"
                name: "heading"
                widget: "string"

              - label: "Safety Features"
                name: "items"
                widget: "list"
                fields:
                  - label: "Title"
                    name: "title"
                    widget: "string"

                  - label: "Description"
                    name: "description"
                    widget: "text"

                  - label: "Icon"
                    name: "icon"
                    widget: "image"

      - name: about
        label: About Us
        file: src/content/pages/about.md
        fields:
          - label: Page Heading
            name: heading
            widget: string

          - label: About Us Content
            name: body
            widget: markdown

      - name: contact
        label: Contact Us
        file: src/content/pages/contact.md
        fields:
          - label: Contact Information
            name: contact
            widget: object
            fields:
              - label: Page Heading
                name: heading
                widget: string
              - label: Address Heading
                name: address_heading
                widget: string
              - label: Address
                name: address
                widget: string
              - label: Google Maps URL
                name: address_url
                widget: string
              - label: Phone Section Heading
                name: phone_heading
                widget: string
              - label: Phone Number
                name: phone
                widget: string
              - label: Email Address
                name: email
                widget: string
                required: false

      - name: downloads
        label: Download Apps
        file: src/content/pages/downloads.md
        fields:
          - label: Download App Content
            name: download
            widget: object
            fields:
              - label: Page Heading
                name: heading
                widget: string

              - label: Description
                name: description
                widget: text

              - label: App Store URL
                name: app_store_url
                widget: string

              - label: Google Play URL
                name: google_play_url
                widget: string

              - label: App Store Badge
                name: app_store_image
                widget: image

              - label: Google Play Badge
                name: google_play_image
                widget: image

              - label: Background Image
                name: background_image
                widget: image

              - label: Phone Mockup Image
                name: phone_image
                widget: image

              - label: Phone Mockup Alt Text
                name: phone_image_alt
                widget: string

      - name: legal
        label: Legal
        file: src/content/pages/legal.md
        fields:
          - label: Page Heading
            name: heading
            widget: string

          - label: Legal Content
            name: body
            widget: markdown

      - name: terms-conditions
        label: Terms & Conditions
        file: src/content/pages/terms-conditions.md
        fields:
          - label: Page Heading
            name: heading
            widget: string

          - label: Terms & Conditions Content
            name: body
            widget: markdown

      - name: how-it-works
        label: How It Works
        file: src/content/pages/how-it-works.md
        fields:
          - label: Page Heading
            name: heading
            widget: string

          - label: How It Works Content
            name: body
            widget: markdown

      - name: trust-safety
        label: Trust, Safety & Insurance
        file: src/content/pages/trust-safety.md
        fields:
          - label: Page Heading
            name: heading
            widget: string

          - label: Trust, Safety & Insurance Content
            name: body
            widget: markdown

      - name: privacy-policy
        label: Privacy Policy
        file: src/content/pages/privacy-policy.md
        fields:
          - label: Page Title
            name: title
            widget: string

          - label: Page Description
            name: description
            widget: string

          - label: Privacy Policy Content
            name: body
            widget: markdown

      - name: help-center
        label: Help Center
        file: src/content/pages/help-center.md
        fields:
          - label: Page Heading
            name: heading
            widget: string

          - label: Help Center Content
            name: body
            widget: markdown